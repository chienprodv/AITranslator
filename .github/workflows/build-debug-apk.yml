name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK and Play AAB for retained local signing
        run: |
          gradle --no-daemon :app:assembleDebug :app:bundleRelease -PunsignedDebug=true --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug-unsigned.apk dist/BUILD_ONLY_DO_NOT_INSTALL.apk.unsigned
          cp app/build/outputs/bundle/release/app-release.aab dist/PLAY_UPLOAD_UNSIGNED.aab

      - uses: actions/upload-artifact@v4
        with:
          name: BUILD-ONLY-UNSIGNED-NOT-INSTALLABLE
          path: dist/*
          if-no-files-found: error
