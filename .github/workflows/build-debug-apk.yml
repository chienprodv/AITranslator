name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build unsigned debug APK for retained local key
        run: gradle --no-daemon :app:assembleDebug -PunsignedDebug=true --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: XinayuAITranslator-unsigned-apk
          path: app/build/outputs/apk/debug/app-debug-unsigned.apk
          if-no-files-found: error
